version: "2"

run:
  tests: true

linters:
  default: standard
  exclusions:
    generated: lax
    presets:
      - std-error-handling
    paths:
      - test
    rules:
      # tests may skip error checks
      - path: _test\.go
        linters:
          - errcheck

formatters:
  enable:
    - gofmt
  exclusions:
    generated: lax
    paths:
      - test

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
